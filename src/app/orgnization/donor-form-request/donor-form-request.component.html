<div class="w-dvh flex">
  <!-- Header -->

  <app-header-side-bar></app-header-side-bar>
      <!-- Main Content -->
  <div class="mt-16 w-full ml-14 transition-all duration-300">
    <!-- Popup -->
    <div
      class="fixed z-10 top-150 text-2xl left-100 w-full py-2 bg-red-600 text-white text-center"
      *ngIf="showPopup"
    >
      {{ popupMessage }}
    </div>
  <div
    class="max-w-md mx-auto bg-white shadow-md mt-40 rounded px-8 pt-6 pb-8 mb-4 border-2 border-gray-100"
  >
    
    <h2 class="text-2xl font-bold mb-4 text-center text-red-600">
      request Details
    </h2>
    <form [formGroup]="donorForm" (ngSubmit)="onSubmit()">
      <!-- Blood Group -->
      <div class="mb-4">
        <label
          class="block text-gray-700 text-sm font-bold mb-2"
          for="blood_group"
        >
          Blood Group
        </label>
        <select
          id="blood_group"
          formControlName="blood_group"
          class="shadow appearance-none border-2 border-red-200 rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
        >
          <option value="">Select Blood Group</option>
          <option value="A+">A+</option>
          <option value="A-">A-</option>
          <option value="B+">B+</option>
          <option value="B-">B-</option>
          <option value="O+">O+</option>
          <option value="O-">O-</option>
          <option value="AB+">AB+</option>
          <option value="AB-">AB-</option>
        </select>
        <p
          *ngIf="donorForm?.['blood_group']?.touched && donorForm?.['blood_group']?.invalid"
          class="text-red-600 text-xs italic"
        >
          Blood Group is required.
        </p>
      </div>

      <div class="mb-4">
        <label
          class="block text-gray-700 text-sm font-bold mb-2"
          for="blood_Quantity"
        >
          Blood Quantity
        </label>
        <input
          type="number"
          id="blood_Quantity"
          formControlName="blood_Quantity"
          class="shadow appearance-none border-2 border-red-200 rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
          placeholder="Enter Blood Quantity"
        />
        <p
          *ngIf="donorForm?.['blood_Quantity']?.touched && donorForm?.['blood_Quantity']?.invalid"
          class="text-red-600 text-xs italic"
        >
          Valid Blood Quantity is required.
        </p>
      </div>

      <!-- Submit Button -->
      <div class="flex items-center justify-between">
        <button
          class="bg-red-500 hover:bg-red-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline ml-80"
          type="submit"
          [disabled]="donorForm.invalid"
        >
          Next
        </button>
      </div>
    </form>
  </div>
</div>
</div>
