

<div class="h-dvh w-screen flex bg-gray-100">
  <!-- Header -->
  <app-header-side-bar></app-header-side-bar>
  <div class="mt-16 ml-90+ mx-auto p-6 rounded-2xl shadow-2xl">
    <div class="flex items-center bg-gray-100 justify-center p-6">
      <div class="max-w-lg w-full shadow-xl rounded-2xl overflow-hidden border border-red-400">
        <div class="px-8 py-6">
          <h2 class="text-3xl font-semibold text-red-700 text-center">Profile</h2>
          <div class="mt-5 mb-6 text-gray-700">
            <p class="text-xl">
              <strong class="text-black-900">Name:</strong> {{ organizationProfile.name }}
            </p>
            <p class="text-xl">
              <strong class="text-black-900">Email:</strong> {{ organizationProfile.email }}
            </p>
            <p class="text-xl">
              <strong class="text-black-900">Phone:</strong> {{ organizationProfile.phone }}
            </p>
            <p class="text-xl">
              <strong class="text-black-900">Address:</strong> {{ organizationProfile.address }}
            </p>
            <p class="text-xl">
              <strong class="text-black-900">Blood Groups:</strong>
            </p>
            <ul>
              <li *ngFor="let bloodGroup of bloodGroupsArray">
                {{ bloodGroup.bloodGroup }}: {{ bloodGroup.quantity }}
              </li>
            </ul>
          </div>
          <!-- Button Section -->
          <div class="px-8 py-6 bg-red-100 border-t border-red-300">
            <button *ngIf="currentPath == '/org/Profile'" (click)="Edit()" class="bg-green-500 hover:bg-green-600 text-white text-2xl p-2 ml-24 px-8 rounded mr-2">
              Edit
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
