<div class="h-dvh w-screen flex bg-gray-100">
  <app-header-side-bar></app-header-side-bar>
<div class="max-w-2xl mx-auto p-6 bg-red-100 rounded-lg shadow-lg">


  <!-- Check if there are users to display -->
  <div>
    <div class="bg-white p-6 rounded-lg shadow-md">
      <h1 class="text-2xl font-semibold text-center text-red-600 mt-8 mb-6">Profile</h1>
      <div class="mb-6 p-4 bg-red-50 rounded-lg shadow">
        <div class="flex items-center space-x-4 mb-4">
          <div class="w-14 h-14 bg-red-500 rounded-full flex items-center justify-center text-white font-bold text-lg">
            {{ organizationProfile.name[0] | uppercase }}
          </div>
          <h2 class="text-lg font-semibold text-black-700">{{ organizationProfile.name }}</h2>
        </div>

        <!-- Field Cards -->
        <div class="grid gap-3">
          <div class="bg-red-200 p-3 rounded-md shadow-sm">
            <span class="text-black-600 font-semibold">Email:</span> {{ organizationProfile.email }}
          </div>
          <div class="bg-red-200 p-3 rounded-md shadow-sm">
            <span class="text-black-600 font-semibold">Phone:</span> {{ organizationProfile.phone }}
          </div>
          <div class="bg-red-200 p-3 rounded-md shadow-sm">
            <span class="text-black-600 font-semibold">Location:</span> {{ organizationProfile.address }}
          </div>
          <div class="bg-red-200 p-3 rounded-md shadow-sm">
            <span class="text-black-600 font-semibold mb-8">BlooodGroups:</span>
            <ul>
              <li *ngFor="let bloodGroup of bloodGroupsArray">
                <span class="text-red-600 text-lg font-semibold"> {{ bloodGroup.bloodGroup }}: {{ bloodGroup.quantity }}</span>
              </li>
            </ul>
          
          </div>
          <div class="px-8 ml-24">
            <button *ngIf="currentPath == '/org/Profile'" (click)="Edit()" class="bg-red-500 hover:bg-red-600 text-white text-2xl p-2 ml-24 px-8 rounded mr-2">
              Edit
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
</div>
