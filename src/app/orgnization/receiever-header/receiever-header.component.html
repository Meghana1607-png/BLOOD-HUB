<div class="h-dvh w-dvh flex">
  <!-- Header -->
  <div
    class="h-16 fixed top-0 z-50 bg-red-600 text-white p-3 w-full flex items-center justify-between shadow-lg"
  >
    <div class="flex items-center">
      <button
        (click)="show_slidebar()"
        class="pi pi-bars cursor-pointer p-2 text-base flex items-center justify-center"
      ></button>
      <span class="font-semibold capitalize text-xl ml-4">
        {{ selectedPage }}
      </span>
    </div>
    <div class="flex items-center space-x-4">
      <button
        class="px-4 text-xl py-2 bg-red-700 text-white rounded-lg hover:bg-red-800 transition-colors duration-300"
        routerLink="/viewProfile"
      >
        Profile
      </button>
      <button
        class="px-4 text-xl py-2 bg-red-700 text-white rounded-lg hover:bg-red-800 transition-colors duration-300"
        (click)="logout()"
      >
        Signout
      </button>
      <!-- switchRole -->
      <div class="relative inline-block text-left">
        <button
          class="px-4 text-xl py-2 bg-red-700 text-white rounded-lg hover:bg-red-800 transition-colors duration-300"
          (click)="toggleDropdown($event)"
        >
          Switch Role
        </button>
        <!-- Dropdown Menu -->
        <div
          *ngIf="showDropdown"
          class="absolute mt-2 w-40 bg-white rounded-lg shadow-lg z-10"
        >
          <button
            class="w-full px-4 py-2 text-left text-gray-700 hover:bg-gray-100 transition-colors duration-300"
            (click)="selectRole('donors')"
            routerLink="/donor/dashboard"
          >
            Donors
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Sidebar -->
  <nav
    class="fixed top-16 left-0 z-50 h-full bg-red-600 text-white flex flex-col transition-all duration-300 w-14 hover:w-56 group"
  >
    <div
      *ngFor="let op of menu"
      (click)="NavToPage(op.path); onPageChange(op.label)"
      class="h-16 px-4 flex items-center cursor-pointer hover:bg-red-800 transition-colors duration-300"
    >
      <i [class]="op.icon + ' text-xl mr-4'"></i>
      <span
        class="ml-2 text-white text-sm opacity-0 group-hover:opacity-100 transition-opacity duration-300 whitespace-nowrap capitalize"
      >
        {{ op.label }}
      </span>
    </div>
  </nav>

  <!-- Confirm Logout Popup -->
  <div
    class="fixed top-0 left-0 z-50 w-full h-full bg-gray-500 bg-opacity-50 flex items-center justify-center"
    *ngIf="showConfirmLogoutPopup"
  >
    <div class="bg-white rounded-lg shadow-lg p-8">
      <h2 class="text-2xl mb-8 flex justify-center mt-4 font-bold">
        Confirm Signout
      </h2>
      <p class="text-xl text-black-600 mb-8">
        Are you sure you want to logout?
      </p>
      <div class="flex justify-center">
        <button
          class="px-4 text-xl py-2 bg-red-500 text-black rounded-lg hover:bg-red-600 transition-colors duration-300 mr-4"
          (click)="confirmLogout()"
        >
          Signout
        </button>
        <button
          class="px-4 text-xl py-2 bg-green-500 text-black-600 rounded-lg hover:bg-green-600 transition-colors duration-300 ml-4"
          (click)="cancelLogout()"
        >
          Cancel
        </button>
      </div>
    </div>
  </div>
</div>
