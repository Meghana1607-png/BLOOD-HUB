<div class="w-dvh flex bg-gray-100">
  <!-- Header -->

  <app-header-side-bar></app-header-side-bar>
<div class="mt-16 ml-64 mx-auto p-6 bg-gray-100 min-h-screen">
  <h1 class="text-2xl font-semibold text-center mb-6">Approved Receivers List</h1>

  <div *ngIf="approvedReceiver?.length; else noData" class="space-y-4">
    <div
      *ngFor="let receiver of approvedReceiver"
      class="flex items-center justify-between p-4 bg-white rounded-lg shadow-md"
    >
      <!-- receiver Details -->
      <div class="flex items-center">
        <div class="flex-shrink-0 mr-4">
          <img
            [src]="receiver.logo || 'https://via.placeholder.com/50'"
            alt="receiver Logo"
            class="w-12 h-12 rounded-full object-cover"
          />
        </div>
        <div class="mr-64 ml-4">
          <p class="text-lm text-black-600">{{ receiver.email }}</p>
          <p class="text-lm text-black-600">{{ receiver.status }}</p>
        </div>
      </div>
    </div>
  </div>

  <ng-template #noData>
    <p class="text-center text-black-600">No Approved Receivers found.</p>
  </ng-template>
</div>
</div>
