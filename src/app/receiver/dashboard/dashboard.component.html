  <div class="h-16 fixed top-0 z-50 bg-red-600 text-white p-3 w-full flex items-center justify-between shadow-lg">
    <div class="flex items-center">
      <button (click)="show_slidebar()"
        class="pi pi-bars cursor-pointer p-2 text-base flex items-center justify-center"></button>
      <span class="font-semibold capitalize text-xl ml-4">
        {{ selectedPage }}
      </span>
    </div>

      <!-- switchRole -->
      <div class="relative inline-block text-left">
        <button class="px-4 py-2 bg-red-700 text-white rounded-lg hover:bg-red-500 transition-colors duration-300"
          (click)="toggleDropdown($event)">
          Switch Role
        </button>
        <!-- Dropdown Menu -->
        <div *ngIf="showDropdown" class="absolute mt-2 w-40 bg-white rounded-lg shadow-lg z-10">
          <button class="w-full px-4 py-2 text-left text-gray-700 hover:bg-gray-100 transition-colors duration-300"
            (click)="selectRole('donors')" routerLink="/don">
            Donors
          </button>
        </div>
      </div>
    </div>

  <!-- Sidebar -->
  <nav
    class="fixed top-16 left-0 z-50 h-full bg-red-600 text-white flex flex-col transition-all duration-300 w-14 hover:w-56 group">
    <div *ngFor="let op of menu" (click)="NavToPage(op.path); onPageChange(op.label)"
      class="h-16 px-4 flex items-center cursor-pointer hover:bg-red-500 transition-colors duration-300">
      <i [class]="op.icon + ' text-xl mr-4'"></i>
      <span
        class="ml-2 text-white text-sm opacity-0 group-hover:opacity-100 transition-opacity duration-300 whitespace-nowrap capitalize">
        {{ op.label }}
      </span>
    </div>
  </nav>
  <div class="grid grid-cols-2 gap-2 ml-60 mt-0"></div>
  <div class="flex flex-wrap gap-8 ml-60 mt-20">

  <div class="h-[6cm] w-[6cm] bg-white shadow-lg rounded-lg flex flex-col justify-center items-center p-4 ml-60 mt-0">

    </h2>
    <button
