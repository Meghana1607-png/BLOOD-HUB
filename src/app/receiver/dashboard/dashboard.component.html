<div class="h-dvh w-dvh flex">
  <app-header-bar></app-header-bar>
  <!-- Header -->
     <!-- Main Content -->
  <div class="mt-16 w-full ml-8 transition-all duration-300">
    <!-- Popup -->
    <div
      class="fixed z-10 top-150 text-2xl left-100 w-full py-2 bg-red-600 text-white text-center"
      *ngIf="showPopup"
    >
      {{ popupMessage }}
    </div>
  <div class="flex items-center justify-center">
    <div
      class="h-[6cm] w-[6cm] bg-white shadow-lg rounded-lg flex flex-col justify-center items-center p-4 mt-24 mb-16"
    >
      <h2 class="text-center text-sm font-semibold text-gray-800">
        Make Request to Org
      </h2>
      <button
        class="px-2 py-1 bg-red-700 text-white text-sm font-medium mt-8 rounded hover:bg-red-700 focus:outline-none focus:ring-2 focus:ring-red-400"
        routerLink="/rec-form"
      >
        Open
      </button>
    </div>
  </div>
</div>
</div>
